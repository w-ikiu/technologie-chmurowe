# service typu nodeport - udostepnia backend na porcie hosta
# dzieki temu mozna testowac lokalnie przez port-forward lub nodeport
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
