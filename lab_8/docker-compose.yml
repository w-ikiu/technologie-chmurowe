# plik bazowy - wspolna konfiguracja dla dev i prod
# nie zawiera portow dev ani bind mountow

services:
  # postgres - baza danych, tylko w db-net
  postgres:
    image: postgres:15-alpine
    environment:
      # zmienna obowiazkowa - compose zglosi blad jesli brak w .env
      POSTGRES_DB: ${POSTGRES_DB:?Ustaw POSTGRES_DB w pliku .env}
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_user
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d ${POSTGRES_DB:?Ustaw POSTGRES_DB w pliku .env}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # redis - cache, tylko w app-net
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # backend_1 - pierwsza instancja backendu
  backend_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lab_8-backend_1:${APP_VERSION:-latest}
    environment:
      BACKEND_PORT: 3000
      POSTGRES_DB: ${POSTGRES_DB:?Ustaw POSTGRES_DB w pliku .env}
      POSTGRES_HOST: postgres
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    env_file:
      - path: .env.common
        required: true
      - path: .env.local
        required: false
    secrets:
      - db_user
      - db_password
    configs:
      - source: app_config
        target: /app/app.config.json
    volumes:
      - backend-logs:/app/logs
    networks:
      - proxy-net
      - app-net
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # backend_2 - druga instancja backendu, ten sam dockerfile
  backend_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lab_8-backend_2:${APP_VERSION:-latest}
    environment:
      BACKEND_PORT: 3001
      POSTGRES_DB: ${POSTGRES_DB:?Ustaw POSTGRES_DB w pliku .env}
      POSTGRES_HOST: postgres
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    env_file:
      - path: .env.common
        required: true
      - path: .env.local
        required: false
    secrets:
      - db_user
      - db_password
    configs:
      - source: app_config
        target: /app/app.config.json
    volumes:
      - backend-logs:/app/logs
    networks:
      - proxy-net
      - app-net
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # worker - przetwarzanie w tle, bez portu na hoscie
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: lab_8-worker:${APP_VERSION:-latest}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Ustaw POSTGRES_DB w pliku .env}
      POSTGRES_HOST: postgres
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    env_file:
      - path: .env.common
        required: true
      - path: .env.local
        required: false
    secrets:
      - db_user
      - db_password
    networks:
      - app-net
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # nginx - load balancer, jedyny punkt wejscia
  nginx:
    image: nginx:alpine
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    networks:
      - proxy-net
    depends_on:
      backend_1:
        condition: service_started
      backend_2:
        condition: service_started

  # adminer - panel bazy danych, profil debug
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    networks:
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - debug

  # pgadmin - zaawansowany panel bazy danych, profil debug
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - debug

  # db-migrator - jednorazowa usluga migracji, profil migrate
  db-migrator:
    image: alpine
    command: >
      sh -c "echo 'uruchamianie migracji bazy danych...' &&
             sleep 2 &&
             echo 'migracja zakonczona pomyslnie'"
    restart: "no"
    networks:
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate

# trzy izolowane sieci z wlasnymi podsieciami i bramami
networks:
  proxy-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
  app-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
          gateway: 172.21.0.1
  db-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
          gateway: 172.22.0.1

# nazwane wolumeny dla trwalosci danych
volumes:
  postgres-data:
  redis-data:
  backend-logs:

# sekrety dostarczane z plikow
secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt

# pliki konfiguracyjne
configs:
  nginx_config:
    file: ./nginx.conf
  app_config:
    file: ./backend/app.config.json
