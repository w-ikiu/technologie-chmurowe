# konfiguracja nginx jako load balancer przed dwoma instancjami backendu
events {
    worker_connections 1024;
}

http {
    # blok upstream definiuje dwie instancje backendu do load balancingu
    # nginx domyslnie rozdziela ruch metoda round-robin
    upstream backend {
        server backend_1:3000;
        server backend_2:3001;
    }

    server {
        listen 80;

        # zapytania /api/ przekazywane do upstreamu z load balancingiem
        # rewrite usuwa prefiks /api zanim zapytanie trafi do backendu
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # pozostale zapytania serwuja pliki statyczne frontendu
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
