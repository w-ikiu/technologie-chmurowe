# blok upstream definiuje dwie instancje backendu do load balancingu
# nginx domyslnie rozdziela ruch metoda round-robin (naprzemiennie)
# oba backendy nasluchuja wewnatrz sieci na porcie 3000
upstream backend {
    server backend_1:3000;
    server backend_2:3000;
}

server {
    listen 80;

    # zapytania /api/ sa przekazywane do upstreamu z load balancingiem
    # rewrite usuwa prefiks /api zanim zapytanie trafi do backendu
    # bo backend wystawia endpointy /items /stats /health bez prefiksu
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # pozostale zapytania serwuja pliki statyczne frontendu
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}